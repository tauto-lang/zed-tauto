# Supply-chain cooldown: refuse crate versions published less than 14 days ago
# when resolving (cargo update / add / a new lockfile entry). Honored by the
# nightly Cargo pinned in rust-toolchain.toml; stable Cargo ignores these keys
# (with a warning).
[registry]
global-min-publish-age = "14 days"

[resolver]
incompatible-publish-age = "deny"
